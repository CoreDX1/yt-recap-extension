<!-- full.html -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Recap · Music</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ff4e45'/%3E%3Cstop offset='100%25' stop-color='%23ff99cc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2316161d'/%3E%3Cpath d='M12 9.5l11 6.5-11 6.5z' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="full.css" />
  </head>
  <body class="full-shell" data-scope="music">
    <div class="shell">
      <aside class="side" aria-label="Navegación principal">
        <button
          id="brandBtn"
          type="button"
          class="brand"
          title="Cambiar de página"
        >
          <span class="brand-logo" id="brandLogo" aria-hidden="true">▶</span>
          <span class="brand-word" id="brandWord">Music</span>
          <span class="brand-swap" aria-hidden="true">⇄</span>
        </button>

        <nav class="side-nav" id="sideNav" aria-label="Secciones">
          <button type="button" class="side-link active" data-route="home">
            <span aria-hidden="true">⌂</span> Inicio
          </button>
          <button type="button" class="side-link" data-route="explore">
            <span aria-hidden="true">◭</span> Explorar
          </button>
          <button type="button" class="side-link" data-route="calendar">
            <span aria-hidden="true">▦</span> Calendario
          </button>
          <button type="button" class="side-link" data-route="people">
            <span aria-hidden="true">◉</span>
            <span id="peopleLabel">Artistas</span>
          </button>
          <button type="button" class="side-link" data-route="likes">
            <span aria-hidden="true">❤</span> Likes
          </button>
        </nav>

        <button id="newPlaylistBtn" type="button" class="side-new">
          <span aria-hidden="true">＋</span> Playlist instantánea
        </button>

        <div
          class="side-lists"
          id="sideLists"
          aria-label="Recaps y listas"
        ></div>

        <div class="side-foot">
          <button id="enrichMusicBtn" type="button" class="footer-link">
            Reclasificar música importada
          </button>
          <button id="clearBtn" type="button" class="danger-link">
            Borrar historial local
          </button>
        </div>
      </aside>

      <div class="main-col">
        <header class="topbar">
          <div class="search-wrap">
            <input
              id="globalSearch"
              type="search"
              class="global-search"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
              placeholder="Buscar temas, artistas, canales…"
              aria-label="Buscar en tu recap"
            />
            <div id="searchDrop" class="search-drop" hidden></div>
          </div>
          <div class="top-actions">
            <button id="importBtn" type="button" class="pill-btn">
              Importar
            </button>
            <input
              id="importInput"
              type="file"
              accept=".json,.zip,application/json,application/zip"
              hidden
            />
            <button id="exportBtn" type="button" class="pill-btn">
              Exportar
            </button>
            <button
              id="miniToggleBtn"
              type="button"
              class="pill-btn"
              title="Mostrar miniplayer"
              aria-label="Mostrar miniplayer"
            >
              <span aria-hidden="true">▣</span>
            </button>
          </div>
        </header>

        <div
          class="chips-row"
          id="periodChips"
          role="group"
          aria-label="Período"
        ></div>

        <main class="content" id="content">
          <section id="route-home" class="route"></section>
          <section id="route-explore" class="route" hidden></section>
          <section id="route-calendar" class="route" hidden>
            <div id="calHost"></div>
          </section>
          <section id="route-people" class="route" hidden></section>
          <section id="route-likes" class="route" hidden></section>
          <section id="route-results" class="route" hidden></section>
        </main>
      </div>
    </div>

    <div
      class="playerbar"
      id="playerbar"
      role="region"
      aria-label="Reproducción en vivo"
    >
      <input
        id="pbSeek"
        class="pb-seek"
        type="range"
        min="0"
        max="1000"
        value="0"
        step="1"
        aria-label="Posición de reproducción"
      />
      <div class="pb-left">
        <button
          id="pbPrev"
          type="button"
          class="pb-ctl"
          title="Anterior"
          aria-label="Anterior"
        >
          ⏮
        </button>
        <button
          id="pbPlay"
          type="button"
          class="pb-ctl pb-play"
          title="Reproducir / pausar"
          aria-label="Reproducir o pausar"
        >
          ▶
        </button>
        <button
          id="pbNext"
          type="button"
          class="pb-ctl"
          title="Siguiente"
          aria-label="Siguiente"
        >
          ⏭
        </button>
        <span id="pbTime" class="pb-time">0:00 / 0:00</span>
      </div>
      <div class="pb-center">
        <img id="pbThumb" class="pb-thumb" alt="" decoding="async" />
        <div class="pb-meta">
          <div id="pbTitle" class="pb-title">Nada reproduciéndose ahora</div>
          <div id="pbArtist" class="pb-artist">
            Abrí YouTube o YT Music en otra pestaña
          </div>
        </div>
        <span id="pbSource" class="badge source" hidden>—</span>
        <span id="pbLoopBadge" class="badge loop" hidden
          ><span aria-hidden="true">🔁</span> Bucle</span
        >
      </div>
      <div class="pb-right">
        <button
          id="pbMute"
          type="button"
          class="pb-ctl"
          title="Silenciar"
          aria-label="Silenciar"
        >
          🔊
        </button>
        <input
          id="pbVol"
          class="pb-vol"
          type="range"
          min="0"
          max="100"
          value="100"
          aria-label="Volumen"
        />
        <button
          id="pbLoop"
          type="button"
          class="pb-ctl"
          title="Bucle"
          aria-label="Bucle"
        >
          🔁
        </button>
        <button
          id="pbShuffle"
          type="button"
          class="pb-ctl"
          title="Aleatorio (YT Music)"
          aria-label="Aleatorio"
        >
          🔀
        </button>
        <button
          id="pbQueue"
          type="button"
          class="pb-ctl"
          title="Otras pestañas"
          aria-label="Otras pestañas"
        >
          ☰
        </button>
        <button
          id="pbJump"
          type="button"
          class="pb-ctl"
          title="Ir a la pestaña"
          aria-label="Ir a la pestaña"
        >
          ↗
        </button>
      </div>
    </div>

    <div id="miniplayer" class="miniplayer" hidden>
      <div class="mp-head">
        <span class="mp-label">Miniplayer</span>
        <button
          id="mpClose"
          type="button"
          class="pb-ctl"
          title="Cerrar"
          aria-label="Cerrar miniplayer"
        >
          ✕
        </button>
      </div>
      <img id="mpThumb" class="mp-thumb" alt="" decoding="async" />
      <div id="mpTitle" class="mp-title">—</div>
      <div id="mpArtist" class="mp-artist">—</div>
      <div class="mp-bar"><div id="mpFill" class="mp-fill"></div></div>
      <div class="mp-actions">
        <button
          id="mpPlay"
          type="button"
          class="pb-ctl pb-play"
          aria-label="Reproducir o pausar"
        >
          ▶
        </button>
        <button
          id="mpJump"
          type="button"
          class="pb-ctl"
          title="Ir a la pestaña"
          aria-label="Ir a la pestaña"
        >
          ↗
        </button>
      </div>
    </div>

    <div id="queuePop" class="queue-pop" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="confirmClearDialog" class="confirm-dialog">
      <h2 class="dialog-title">¿Borrar historial local?</h2>
      <p class="dialog-desc">
        Se eliminarán tus reproducciones, búsquedas, likes, skips y visitas a
        canales guardados en este navegador.
      </p>
      <div class="dialog-actions">
        <button id="cancelClearBtn" type="button" class="pill-btn">
          Cancelar
        </button>
        <button id="confirmClearBtn" type="button" class="pill-btn danger">
          Sí, borrar todo
        </button>
      </div>
    </dialog>

    <script type="module" src="src/full.js"></script>
  </body>
</html>
